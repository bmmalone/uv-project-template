[build-system]
requires = ["setuptools>=75.0", "setuptools_scm[toml]>=8.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_prj"
description = "uv project template"
classifiers = ["Programming Language :: Python :: 3"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.3",
    "loguru>=0.7.2",
    "pandas>=2.2.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "tqdm>=4.67.0",
]
dynamic = ["version"]

[tool.setuptools_scm]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "mypy>=1.10.0",
    "pandas-stubs>=2.3.2.250827",
    "pytest-cov>=5.0.0",
    "pytest-datadir>=1.5.0",
    "pytest-env>=0.8.1",
    "pytest-mock>=3.14.1",
    "pytest-workflow>=2.1.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "types-setuptools>=67.6.0.0",
    "types-tqdm>=4.67.0.20241119",
    "types-PyYAML>=6.0.12.20250516",
]

[project.scripts]
my-prj-cli = "my_prj.cli:cli"


[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
addopts = "-rsx -q --cov-append --tb=short  --ignore=setup.py --cov-report=xml"
norecursedirs = ["venv", ".venv"]
log_cli = true
log_cli_level = "INFO"
markers = [
    "slow: marks tests as slow (run with --slow)",
    "external: marks tests that use external APIs (run with --external)",
]

[tool.mypy]
exclude = ["venv", "build", ".venv"]
plugins = ["pydantic.mypy"]
strict = false          # set true if you want to go all-in
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = """\
    google.generativeai.types.generation_types,\
    hdbscan,\
    llama_index,\
    llama_index.core,\
    llama_index.core.base.embeddings.base,\
    llama_index.core.chat_engine,\
    llama_index.core.embeddings,\
    llama_index.core.indices.base,\
    llama_index.core.indices.vector_store.retrievers,\
    llama_index.core.ingestion,\
    llama_index.core.llms.llm,\
    llama_index.core.node_parser,\
    llama_index.core.output_parsers,\
    llama_index.core.program,\
    llama_index.core.retrievers,\
    llama_index.core.schema,\
    llama_index.core.vector_stores,\
    llama_index.embeddings.gemini,\
    llama_index.llms.gemini,\
    llama_index.vector_stores.pinecone,\
    nbformat,\
    pinecone,\
    pysbd,\
    pymupdf,\
    sklearn,\
    sklearn.mixture"""
ignore_missing_imports = true

[tool.ruff]
line-length = 120 # a bit longer than Black

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["I", "C901"] # isort and cog-complexity near-equivalent

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["my_prj", "my_prj_config"] # our packages

[tool.coverage.run]
branch = true
source = ["my_prj", "my_prj_config"]
omit = ["test/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80  # set to whatever your threshold is